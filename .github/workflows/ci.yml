# Managed by Ivaldi. This file is the same in every Project and is kept
# current for you, so don't edit it. CI logic lives in the shared workflow.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: worldtree-industries/workflows/.github/workflows/go.yml@1871647922e0739445221c34f8917ab1566e46b1 # v1.2.0
    with:
      platforms: linux/amd64,linux/arm64
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
